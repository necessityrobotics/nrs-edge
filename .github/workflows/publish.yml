# Publish the Python package to PyPI. It runs only when a GitHub release is published, or when it is started by hand.
# It uses PyPI "trusted publishing": no password and no token is stored in this repository. Before the first run, the
# owner of the PyPI project must add this repository and this workflow as a trusted publisher on pypi.org
# (project nrs-edge, owner necessityrobotics, repository nrs-edge, workflow publish.yml, environment pypi).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the package and test the wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist
      - name: Install the wheel into a clean environment and check it
        run: |
          python -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheeltest/bin/nrs-edge check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
