# Publish the Python package to PyPI. It runs only when a version tag (v*) is pushed, when a GitHub release is published,
# or when it is started by hand. A push to a branch never starts it.
# It uses PyPI "trusted publishing": no password and no token is stored in this repository. Before the first run, the
# PyPI account that will manage the project must add a "pending publisher" on pypi.org:
#   project name nrs-edge, owner necessityrobotics, repository nrs-edge, workflow publish.yml, environment pypi.
# The build job tests the wheel (ONNX path and PyTorch path) and the source package before anything is uploaded.
name: publish

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the package and test it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must be the version of the package
        if: github.event_name != 'workflow_dispatch'
        run: |
          v=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          echo "package version $v, tag $tag"
          test "v$v" = "$tag"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          ls -l dist
      - name: Wheel, ONNX path, in a clean environment
        run: |
          python -m venv /tmp/t_wheel
          /tmp/t_wheel/bin/pip install dist/*.whl
          cd /tmp && /tmp/t_wheel/bin/nrs-edge check
      - name: Wheel, PyTorch path as well
        run: |
          /tmp/t_wheel/bin/pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          /tmp/t_wheel/bin/pip install "$(ls dist/*.whl)[torch]"
          cd /tmp && /tmp/t_wheel/bin/nrs-edge check --backend both
      - name: Source package, in a second clean environment
        run: |
          python -m venv /tmp/t_sdist
          /tmp/t_sdist/bin/pip install dist/*.tar.gz
          cd /tmp && /tmp/t_sdist/bin/nrs-edge check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
