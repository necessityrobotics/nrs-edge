[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrs-edge"
version = "0.1.1"
description = "nrs-edge: a small stereo depth network (6 M parameters). Disparity and metric depth from a rectified stereo pair."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Necessity Robotics", email = "necessityrobotics@gmail.com" }]
keywords = ["stereo", "depth", "disparity", "robotics", "onnx"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "onnxruntime>=1.18",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# the PyTorch path (any picture size). torch and torchvision come from the same index, so they match.
torch = ["torch", "torchvision", "timm>=1.0", "safetensors>=0.4"]

[project.scripts]
nrs-edge = "nrs_edge.cli:main"

[project.urls]
Homepage = "https://necessityrobotics.github.io/depth.html#edge"
Repository = "https://github.com/necessityrobotics/nrs-edge"
Weights = "https://huggingface.co/Pyassahu/nrs-edge"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE", "NOTICE", "ATTRIBUTION.md", "LICENSES/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nrs_edge = ["_files.json", "data/*", "data/reference/*", "third_party/LiteAnyStereo/*", "third_party/LiteAnyStereo/core/*"]
